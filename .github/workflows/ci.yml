name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ─── 1. Liquid linting ────────────────────────────────────────────────────
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shopify/theme-check-action@v2

  # ─── 2. Template JSON validation ─────────────────────────────────────────
  validate-json:
    name: Validate Template JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip comments and validate all template JSON files
        run: |
          failed=0
          for f in templates/*.json config/settings_data.json; do
            [ -f "$f" ] || continue
            # Strip /* */ comment headers that Shopify injects
            stripped=$(sed 's|/\*.*\*/||' "$f")
            if ! echo "$stripped" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          exit $failed

  # ─── 3. E2E tests against preview theme ──────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [theme-check, validate-json]
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_DEV_THEME_ID: ${{ secrets.SHOPIFY_DEV_THEME_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check required secrets
        run: |
          missing=0
          for var in SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE_DOMAIN SHOPIFY_DEV_THEME_ID; do
            if [ -z "${!var}" ]; then
              echo "⚠️  Secret $var is not set — E2E tests will be skipped"
              missing=1
            fi
          done
          echo "SECRETS_OK=$([ $missing -eq 0 ] && echo true || echo false)" >> $GITHUB_ENV

      - name: Push to dev/preview theme
        if: env.SECRETS_OK == 'true'
        run: |
          npm install -g @shopify/cli@latest
          shopify theme push \
            --store "$SHOPIFY_STORE_DOMAIN" \
            --theme "$SHOPIFY_DEV_THEME_ID" \
            --path . \
            --allow-live \
            --no-color
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

      - name: Run Playwright tests
        if: env.SECRETS_OK == 'true'
        env:
          E2E_BASE_URL: "https://${{ secrets.SHOPIFY_STORE_DOMAIN }}?preview_theme_id=${{ secrets.SHOPIFY_DEV_THEME_ID }}"
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── 4. Deploy to live (main branch only, all checks must pass) ───────────
  deploy:
    name: Deploy to Live
    runs-on: ubuntu-latest
    needs: [theme-check, validate-json, e2e]
    if: github.ref == 'refs/heads/main'
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required deploy secrets
        run: |
          for var in SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE_DOMAIN SHOPIFY_THEME_ID; do
            if [ -z "${!var}" ]; then
              echo "❌ Required secret $var is not set — cannot deploy"
              exit 1
            fi
          done
          echo "All deploy secrets present ✅"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Push to live theme
        run: |
          shopify theme push \
            --store "$SHOPIFY_STORE_DOMAIN" \
            --theme "$SHOPIFY_THEME_ID" \
            --path . \
            --allow-live \
            --no-color
