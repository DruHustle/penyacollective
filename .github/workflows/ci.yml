name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SHOPIFY_API_VERSION: "2025-04"

jobs:
  # ─── 1. Liquid linting ────────────────────────────────────────────────────
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shopify/theme-check-action@v2

  # ─── 2. Template JSON validation ─────────────────────────────────────────
  validate-json:
    name: Validate Template JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip comments and validate all template JSON files
        run: |
          python3 - <<'PYEOF'
          import re, json, sys, glob

          files = glob.glob('templates/*.json') + ['config/settings_data.json']
          failed = False
          for path in sorted(files):
            try:
              with open(path) as f:
                raw = f.read()
              clean = re.sub(r'/\*.*?\*/', '', raw, flags=re.DOTALL)
              json.loads(clean)
              print(f'✅ {path}')
            except Exception as e:
              print(f'❌ Invalid JSON: {path} — {e}')
              failed = True

          sys.exit(1 if failed else 0)
          PYEOF

  # ─── 3. E2E tests against preview theme ──────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [theme-check, validate-json]
    outputs:
      secrets_ok: ${{ steps.e2e_secrets.outputs.secrets_ok }}
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_DEV_THEME_ID: ${{ secrets.SHOPIFY_DEV_THEME_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check required secrets
        id: e2e_secrets
        shell: bash
        run: |
          missing=0
          for var in SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE_DOMAIN SHOPIFY_DEV_THEME_ID; do
            if [ -z "${!var}" ]; then
              echo "⚠️  Secret $var is not set"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "secrets_ok=true" >> "$GITHUB_OUTPUT"
            echo "All preview-theme E2E secrets present ✅"
            exit 0
          fi

          echo "secrets_ok=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "❌ Required E2E secrets are missing on main — refusing to skip the quality gate"
            exit 1
          fi

          echo "⚠️  E2E secrets missing outside main — preview-theme tests will be skipped"

      - name: Install Shopify CLI
        if: steps.e2e_secrets.outputs.secrets_ok == 'true'
        run: npm install -g @shopify/cli@latest

      - name: Validate preview theme access
        if: steps.e2e_secrets.outputs.secrets_ok == 'true'
        env:
          SHOPIFY_THEME_ID_TO_CHECK: ${{ secrets.SHOPIFY_DEV_THEME_ID }}
          SHOPIFY_THEME_SECRET_NAME: SHOPIFY_DEV_THEME_ID
          SHOPIFY_THEME_LABEL: preview theme
        run: bash scripts/check-shopify-theme-access.sh

      - name: Push to dev/preview theme
        if: steps.e2e_secrets.outputs.secrets_ok == 'true'
        run: |
          shopify theme push \
            --store "$SHOPIFY_STORE_DOMAIN" \
            --theme "$SHOPIFY_DEV_THEME_ID" \
            --path . \
            --allow-live \
            --no-color

      - name: Run Playwright tests
        if: steps.e2e_secrets.outputs.secrets_ok == 'true'
        timeout-minutes: 15
        env:
          E2E_BASE_URL: "https://${{ secrets.SHOPIFY_STORE_DOMAIN }}"
          E2E_PREVIEW_THEME_ID: "${{ secrets.SHOPIFY_DEV_THEME_ID }}"
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── 4. Deploy to live (main branch only, all checks must pass) ───────────
  deploy:
    name: Deploy to Live
    runs-on: ubuntu-latest
    needs: [theme-check, validate-json, e2e]
    if: github.ref == 'refs/heads/main' && needs.e2e.outputs.secrets_ok == 'true'
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
      SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required deploy secrets
        run: |
          for var in SHOPIFY_CLI_THEME_TOKEN SHOPIFY_STORE_DOMAIN SHOPIFY_THEME_ID SHOPIFY_ADMIN_API_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "❌ Required secret $var is not set — cannot deploy"
              exit 1
            fi
          done
          echo "All deploy secrets present ✅"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Validate live theme access
        env:
          SHOPIFY_THEME_ID_TO_CHECK: ${{ secrets.SHOPIFY_THEME_ID }}
          SHOPIFY_THEME_SECRET_NAME: SHOPIFY_THEME_ID
          SHOPIFY_THEME_LABEL: live theme
        run: bash scripts/check-shopify-theme-access.sh

      - name: Push to live theme
        run: |
          shopify theme push \
            --store "$SHOPIFY_STORE_DOMAIN" \
            --theme "$SHOPIFY_THEME_ID" \
            --path . \
            --allow-live \
            --no-color

      - name: Seed content
        run: node scripts/seed-shopify-content.mjs
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}

      - name: Notify on successful deploy
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.zoho.eu
          server_port: 465
          secure: true
          username: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}
          password: ${{ secrets.DEPLOY_NOTIFY_EMAIL_PASSWORD }}
          to: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}
          from: Penya Collective CI <${{ secrets.DEPLOY_NOTIFY_EMAIL }}>
          subject: "✅ Penya Collective — Live theme deployed (${{ github.sha }})"
          body: |
            A new version of the Penya Collective theme was successfully deployed to the live store.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}
            Time: ${{ github.event.head_commit.timestamp }}

            View store: https://${{ secrets.SHOPIFY_STORE_DOMAIN }}
